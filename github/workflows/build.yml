name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descomprimir proyecto
        run: unzip -q MMRL-34296-editado.zip
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        working-directory: MMRL-34296
        run: chmod +x ./gradlew && ./gradlew assembleOfficialDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MMRL-apk
          path: MMRL-34296/app/build/outputs/apk/official/debug/*.apk
